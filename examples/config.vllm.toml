# vLLM serving an OpenAI-compatible endpoint at a fixed address. Any bearer
# token is accepted, so the key is the literal "local"; nothing secret lives
# in this file or in the environment.

[core]
default_provider = "vllm"

[providers.vllm]
driver = "claude"
base_url = "http://192.168.1.20:8000/v1"
model = "Qwen3-32B"
api_key_env = "LOCAL_API_KEY"
api_key = "local"
local = true
max_agents = 1

[providers.vllm.health]
kind = "http"
url = "http://192.168.1.20:8000/health"

[providers.vllm.pricing]
kind = "local"
usd = 0
