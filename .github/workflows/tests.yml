name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Shells for the bash/zsh/fish test
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: Install the project and its test dependencies
        run: uv sync --group dev --group report
      - name: Run the test suite (fake Copilot, no network)
        run: uv run pytest -q
