[project]
name = "subagent"
version = "0.1.0"
description = "Delegate coding work to subagents: an MCP server for several backends (Codex, DeepSeek, GLM, local llama.cpp, oMLX) and a plan-build-test-review loop runner."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "claude-code", "subagent", "codex", "deepseek", "glm", "omlx"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "mcp>=2.0.0",
]

[project.scripts]
subagent = "subagent.cli:main"
subagent-mcp = "subagent.mcp_server:main"

[project.urls]
Homepage = "https://github.com/gaztrabisme/subagent-mcp"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]
report = ["pandas>=2.2", "pyarrow>=15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["BLE001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
